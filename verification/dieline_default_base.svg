<?xml version="1.0" encoding="UTF-8"?>
<!-- 디자인 가이드용, 제조 칼선 아님. 최종 칼선은 인쇄소 템플릿을 사용하세요 -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
     width="243mm" height="293mm" viewBox="-3 -3 243 293"
     data-kind="base" data-cut-width-mm="237" data-cut-height-mm="287" data-bleed-mm="3">
  <title>사바리 하단 몸통 칼선 가이드 (1:1, mm)</title>
  <desc>디자인 가이드용, 제조 칼선 아님. 최종 칼선은 인쇄소 템플릿을 사용하세요. 재단선=빨강 실선, 접는선=파랑 점선, 안내선(여분·면 영역)=초록 점선. 단위 mm.</desc>
  <g id="재단선" inkscape:groupmode="layer" inkscape:label="재단선 (빨강 실선)">
    <polygon points="62.3,62.3 65.3,0 171.7,0 174.7,62.3 237,65.3 237,221.7 174.7,224.7 171.7,287 65.3,287 62.3,224.7 0,221.7 0,65.3" stroke="#e60000" stroke-width="0.3" fill="none" stroke-linejoin="miter"/>
  </g>
  <g id="접는선" inkscape:groupmode="layer" inkscape:label="접는선 (파랑 점선)">
    <line x1="62.3" y1="62.3" x2="174.7" y2="62.3" stroke="#0066ff" stroke-width="0.25" stroke-dasharray="4 2" fill="none"/>
    <line x1="174.7" y1="62.3" x2="174.7" y2="224.7" stroke="#0066ff" stroke-width="0.25" stroke-dasharray="4 2" fill="none"/>
    <line x1="174.7" y1="224.7" x2="62.3" y2="224.7" stroke="#0066ff" stroke-width="0.25" stroke-dasharray="4 2" fill="none"/>
    <line x1="62.3" y1="224.7" x2="62.3" y2="62.3" stroke="#0066ff" stroke-width="0.25" stroke-dasharray="4 2" fill="none"/>
    <line x1="65.3" y1="19.3" x2="171.7" y2="19.3" stroke="#0066ff" stroke-width="0.25" stroke-dasharray="4 2" fill="none"/>
    <line x1="217.7" y1="65.3" x2="217.7" y2="221.7" stroke="#0066ff" stroke-width="0.25" stroke-dasharray="4 2" fill="none"/>
    <line x1="171.7" y1="267.7" x2="65.3" y2="267.7" stroke="#0066ff" stroke-width="0.25" stroke-dasharray="4 2" fill="none"/>
    <line x1="19.3" y1="221.7" x2="19.3" y2="65.3" stroke="#0066ff" stroke-width="0.25" stroke-dasharray="4 2" fill="none"/>
  </g>
  <g id="안내선" inkscape:groupmode="layer" inkscape:label="안내선: 여분·면 영역 (초록 점선)">
    <rect x="-3" y="-3" width="243" height="293" stroke="#00a050" stroke-width="0.2" stroke-dasharray="1 1.5" fill="none"/>
    <rect x="63.5" y="63.5" width="110" height="160" stroke="#00a050" stroke-width="0.2" stroke-dasharray="1 1.5" fill="none"/>
    <rect x="19.3" y="63.5" width="43" height="160" stroke="#00a050" stroke-width="0.2" stroke-dasharray="1 1.5" fill="none"/>
    <rect x="174.7" y="63.5" width="43" height="160" stroke="#00a050" stroke-width="0.2" stroke-dasharray="1 1.5" fill="none"/>
    <rect x="63.5" y="19.3" width="110" height="43" stroke="#00a050" stroke-width="0.2" stroke-dasharray="1 1.5" fill="none"/>
    <rect x="63.5" y="224.7" width="110" height="43" stroke="#00a050" stroke-width="0.2" stroke-dasharray="1 1.5" fill="none"/>
    <text x="118.5" y="143.5" font-size="5" fill="#00a050" text-anchor="middle" dominant-baseline="middle" transform="rotate(270 118.5 143.5)">base_bottom</text>
    <text x="40.8" y="143.5" font-size="5" fill="#00a050" text-anchor="middle" dominant-baseline="middle" transform="rotate(270 40.8 143.5)">base_front</text>
    <text x="196.2" y="143.5" font-size="5" fill="#00a050" text-anchor="middle" dominant-baseline="middle" transform="rotate(90 196.2 143.5)">base_back</text>
    <text x="118.5" y="40.8" font-size="5" fill="#00a050" text-anchor="middle" dominant-baseline="middle" transform="rotate(0 118.5 40.8)">base_right</text>
    <text x="118.5" y="246.2" font-size="5" fill="#00a050" text-anchor="middle" dominant-baseline="middle" transform="rotate(180 118.5 246.2)">base_left</text>
    <text x="-2" y="289" font-size="2.6" fill="#555">디자인 가이드용, 제조 칼선 아님. 최종 칼선은 인쇄소 템플릿을 사용하세요</text>
  </g>
</svg>
